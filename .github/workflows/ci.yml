name: CI

# Repeatable checks for all three projects. Nothing here deploys, migrates a real database
# or touches production: the backend job runs against throw-away service containers.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Both pubspec.lock files were resolved with Flutter 3.44.6 (Dart 3.12.2, revision ee80f08bbf).
  # The SDK pins packages such as clock/matcher/test_api, so a floating "stable" (3.50.x since
  # 2026-11-11) cannot satisfy --enforce-lockfile. Upgrade this and regenerate both lockfiles together.
  FLUTTER_VERSION: "3.44.6"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest on disposable PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: balkavach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/balkavach_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_RATE_LIMIT_PREFIX: balkavach-ci
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      # Raise only for tests that are *known* to skip for a documented reason; the goal is 0.
      MAX_SKIPPED_TESTS: "1"
    defaults:
      run:
        working-directory: balkavach-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: balkavach-backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pure tests (no database needed)
        run: python -m pytest -q -p no:cacheprovider tests/test_attempt_lockout.py tests/test_authorization_boundaries.py tests/test_password_reset_page.py tests/test_rate_limit.py tests/test_auth_security.py
      - name: Baseline schema present?
        # Alembic only *adds* to a schema that already exists in production, so the pre-existing
        # tables must be loaded first. See tests/schema/README.md.
        run: |
          if [ ! -s tests/schema/baseline.sql ]; then
            echo "::error::tests/schema/baseline.sql is missing. Commit a schema-only dump (no data); see tests/schema/README.md"
            exit 1
          fi
      - name: Load baseline schema into the disposable database
        run: psql -h localhost -U postgres -d balkavach_test -v ON_ERROR_STOP=1 -q -f tests/schema/baseline.sql
      - name: Apply migrations (disposable database only)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/balkavach_test
          ALLOW_SCHEMA_MIGRATIONS: "true"
        run: python -m alembic upgrade head
      - name: Full suite
        # DATABASE_URL is deliberately unset here: tests refuse to run if it equals TEST_DATABASE_URL.
        run: python -m pytest -q -rs -p no:cacheprovider --junitxml=junit.xml
      - name: Skipped-test gate
        run: |
          pip install defusedxml
          python scripts/ci_skip_gate.py junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: balkavach-backend/junit.xml

  frontend:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: balkavach-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --no-pub

  admin:
    name: Admin panel (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: balkavach-admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --no-pub
